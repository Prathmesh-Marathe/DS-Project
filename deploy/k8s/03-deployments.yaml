apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-service
  namespace: derrcs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registry-service
  template:
    metadata:
      labels:
        app: registry-service
    spec:
      containers:
        - name: registry-service
          image: 027824090102.dkr.ecr.ap-south-1.amazonaws.com/derrcs/registry-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_PRIORITY
              value: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: derrcs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 027824090102.dkr.ecr.ap-south-1.amazonaws.com/derrcs/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5005
          envFrom:
            - configMapRef:
                name: derrcs-config
          env:
            - name: PORT
              value: "5005"
            - name: NODE_OPTIONS
              value: --experimental-global-webcrypto
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: derrcs-secrets
                  key: MONGODB_URI
            - name: SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_URL
              value: http://auth-service:5005
---
