apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-signaling
  namespace: derrcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker-signaling
  template:
    metadata:
      labels:
        app: broker-signaling
    spec:
      containers:
        - name: broker-signaling
          image: 027824090102.dkr.ecr.ap-south-1.amazonaws.com/derrcs/broker-signaling:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1883
            - containerPort: 9001
            - containerPort: 5004
          envFrom:
            - configMapRef:
                name: derrcs-config
          env:
            - name: SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_PRIORITY
              value: "90"
