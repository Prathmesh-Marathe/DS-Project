apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: derrcs-cluster
  region: ap-south-1

vpc:
  nat:
    gateway: Disable

iam:
  withOIDC: true

managedNodeGroups:
  - name: derrcs-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 30
    privateNetworking: false
    labels:
      app: derrcs
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        albIngress: true
